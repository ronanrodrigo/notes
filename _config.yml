title: Notes
description: Notas organizadas por data
remote_theme: daattali/beautiful-jekyll@6.0.1

plugins:
  - jekyll-remote-theme
  - jekyll-titles-from-headings
  - jekyll-relative-links

# Aplica layout e permalink automáticos para as notas
# sem precisar de pipeline custom para gerar índices.
defaults:
  - scope:
      path: "notes"
    values:
      layout: note
      permalink: /notes/:basename/

# Configurações de Markdown
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# GitHub Pages / Jekyll
lsi: false
safe: true
permalink: pretty

# Arquivos que não precisam ser processados como página do site
exclude:
  - AGENTS.md
