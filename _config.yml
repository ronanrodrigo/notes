title: Notes
description: Notas organizadas por data
baseurl: /notes

collections:
  notes:
    output: true
    permalink: /:collection/:name/

defaults:
  - scope:
      path: ""
      type: "notes"
    values:
      layout: page

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - AGENTS.md
