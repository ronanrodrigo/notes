title: Notes
description: Notas organizadas por data

# Collections para notas
collections:
  notes:
    output: true
    permalink: /notes/:name/

# Defaults para notas
defaults:
  - scope:
      path: ""
      type: "notes"
    values:
      layout: page

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - AGENTS.md
