name: Remove Markdown H1 headings from notes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '_notes/**/*.md'

permissions:
  contents: write

jobs:
  remove-h1:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Remove eligible H1 headings
        id: remove
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('_notes')
          H1 = re.compile(r'^[ \t]{0,3}#(?!#)[ \t]+.+$')
          H2_OR_LOWER = re.compile(r'^[ \t]{0,3}#{2,}[ \t]+.+$')

          def split_lines(data: str):
              return data.splitlines(keepends=True)

          def is_fence(line: str):
              return re.match(r'^[ \t]{0,3}```', line) is not None

          def protected_lines(lines):
              protected = set()
              fenced = False
              html_comment = False
              frontmatter = bool(lines and lines[0].rstrip('\r\n') == '---')
              frontmatter_end = None
              for i, line in enumerate(lines):
                  stripped = line.rstrip('\r\n')
                  if frontmatter:
                      protected.add(i)
                      if i > 0 and stripped == '---':
                          frontmatter = False
                          frontmatter_end = i
                      continue
                  if html_comment:
                      protected.add(i)
                      if '-->' in line:
                          html_comment = False
                      continue
                  if '<!--' in line:
                      protected.add(i)
                      if '-->' not in line[line.index('<!--') + 4:]:
                          html_comment = True
                      continue
                  if is_fence(line):
                      protected.add(i)
                      fenced = not fenced
                      continue
                  if fenced:
                      protected.add(i)
              return protected, frontmatter_end

          files = sorted(ROOT.rglob('*.md')) if ROOT.exists() else []
          changed = []
          removed = []
          total_removed = 0
          before_h2h3 = {}
          had_title = {}

          for path in files:
              original = path.read_text(encoding='utf-8', newline='')
              lines = split_lines(original)
              protected, _ = protected_lines(lines)
              before_h2h3[path] = [line for i, line in enumerate(lines)
                                   if i not in protected and H2_OR_LOWER.match(line)]
              had_title[path] = bool(lines and lines[0].rstrip('\r\n') == '---' and
                                      any(re.match(r'^title[ \t]*:', line) for line in lines[1:]))
              kept = []
              count = 0
              for i, line in enumerate(lines):
                  if i not in protected and H1.match(line):
                      count += 1
                  else:
                      kept.append(line)
              if count:
                  new = ''.join(kept)
                  # Only collapse blank lines immediately after frontmatter when removal left excess.
                  if lines and lines[0].rstrip('\r\n') == '---':
                      match = re.match(r'^(---\r?\n.*?^---[ \t]*\r?\n)(?:[ \t]*\r?\n){3,}', new, re.MULTILINE | re.DOTALL)
                      if match:
                          new = match.group(1) + (match.group(0)[len(match.group(1)):].splitlines(keepends=True)[0] if False else '\n\n') + new[match.end():]
                  if new != original:
                      path.write_text(new, encoding='utf-8', newline='')
                      changed.append(str(path))
                      removed.append(str(path))
                      total_removed += count

          print(f'Arquivos analisados: {len(files)}')
          print(f'Arquivos alterados: {len(changed)}')
          print(f'H1 removidos: {total_removed}')
          print('Arquivos alterados:')
          for name in changed: print(f'  - {name}')
          print('Arquivos que continham H1 removidos:')
          for name in removed: print(f'  - {name}')

          # Persist validation data for the next step without changing tracked files.
          Path('/tmp/notes-validation.txt').write_text('\n'.join(changed), encoding='utf-8')
          PY

      - name: Validate notes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, sys
          root = Path('_notes')
          h1 = re.compile(r'^[ \t]{0,3}#(?!#)[ \t]+.+$')
          h2 = re.compile(r'^[ \t]{0,3}#{2,}[ \t]+.+$')

          def protected(lines):
              out=set(); fence=False; comment=False; front=bool(lines and lines[0].rstrip('\r\n')=='---')
              for i,line in enumerate(lines):
                  s=line.rstrip('\r\n')
                  if front:
                      out.add(i)
                      if i>0 and s=='---': front=False
                      continue
                  if comment:
                      out.add(i)
                      if '-->' in line: comment=False
                      continue
                  if '<!--' in line:
                      out.add(i)
                      if '-->' not in line[line.index('<!--')+4:]: comment=True
                      continue
                  if re.match(r'^[ \t]{0,3}```', line): out.add(i); fence=not fence; continue
                  if fence: out.add(i)
              return out

          failures=[]
          for p in sorted(root.rglob('*.md')):
              lines=p.read_text(encoding='utf-8').splitlines(keepends=True)
              safe=protected(lines)
              real=[(i+1,l.rstrip('\r\n')) for i,l in enumerate(lines) if i not in safe and h1.match(l)]
              if real: failures.append(f'{p}: H1 real restante em {real}')
              if lines and lines[0].rstrip('\r\n')=='---' and not any(re.match(r'^title[ \t]*:',l) for l in lines[1:]):
                  # Files without title are allowed only when they had none originally; this check is enforced for changed files below.
                  pass
          for name in Path('/tmp/notes-validation.txt').read_text(encoding='utf-8').splitlines():
              p=Path(name)
              lines=p.read_text(encoding='utf-8').splitlines(keepends=True)
              if lines and lines[0].rstrip('\r\n')=='---' and not any(re.match(r'^title[ \t]*:',l) for l in lines[1:]):
                  failures.append(f'{p}: campo title ausente após alteração')
          if failures:
              print('\n'.join(failures)); print('VALIDAÇÃO: FALHOU'); sys.exit(1)
          print('VALIDAÇÃO: APROVADA — nenhum H1 Markdown real elegível permaneceu; frontmatter title preservado.')
          PY

      - name: Commit and push changes
        if: steps.remove.outcome == 'success'
        shell: bash
        run: |
          if git diff --quiet -- _notes; then
            echo 'Nenhuma alteração necessária; nenhum commit criado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _notes
          git commit -m 'fix: remove Markdown H1 headings from notes [skip ci]'
          git push origin HEAD:main
