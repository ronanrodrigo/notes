name: Remove Markdown H1 headings from notes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '_notes/**/*.md'

permissions:
  contents: write

jobs:
  remove-h1:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Remove eligible H1 headings
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('_notes')
          H1 = re.compile(r'^[ \t]{0,3}#(?!#)[ \t]+.+$')
          FENCE = re.compile(r'^[ \t]{0,3}```')

          def protected_lines(lines):
              protected = set()
              fenced = False
              html_comment = False
              frontmatter = bool(lines and lines[0].rstrip('\r\n') == '---')
              for index, line in enumerate(lines):
                  stripped = line.rstrip('\r\n')
                  if frontmatter:
                      protected.add(index)
                      if index > 0 and stripped == '---':
                          frontmatter = False
                      continue
                  if html_comment:
                      protected.add(index)
                      if '-->' in line:
                          html_comment = False
                      continue
                  if '<!--' in line:
                      protected.add(index)
                      if '-->' not in line[line.index('<!--') + 4:]:
                          html_comment = True
                      continue
                  if FENCE.match(line):
                      protected.add(index)
                      fenced = not fenced
                      continue
                  if fenced:
                      protected.add(index)
              return protected

          files = sorted(ROOT.rglob('*.md')) if ROOT.exists() else []
          changed = []
          removed_count = 0

          for path in files:
              # Use bytes so Python never normalizes CRLF/LF or other file details while reading.
              original_bytes = path.read_bytes()
              original = original_bytes.decode('utf-8')
              lines = original.splitlines(keepends=True)
              protected = protected_lines(lines)
              kept = []
              count = 0

              for index, line in enumerate(lines):
                  if index not in protected and H1.match(line):
                      count += 1
                  else:
                      kept.append(line)

              new = ''.join(kept)
              if count and new != original:
                  if lines and lines[0].rstrip('\r\n') == '---':
                      new = re.sub(
                          r'(^---\r?\n.*?^---[ \t]*\r?\n)(?:[ \t]*\r?\n){3,}',
                          r'\1\n\n',
                          new,
                          count=1,
                          flags=re.MULTILINE | re.DOTALL,
                      )
                  path.write_bytes(new.encode('utf-8'))
                  changed.append(str(path))
                  removed_count += count

          print(f'Arquivos analisados: {len(files)}')
          print(f'Arquivos alterados: {len(changed)}')
          print(f'H1 removidos: {removed_count}')
          print('Arquivos alterados:')
          for name in changed:
              print(f'  - {name}')
          print('Arquivos que continham H1 removidos:')
          for name in changed:
              print(f'  - {name}')
          Path('/tmp/notes-validation.txt').write_text('\n'.join(changed), encoding='utf-8')
          PY

      - name: Validate notes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          ROOT = Path('_notes')
          H1 = re.compile(r'^[ \t]{0,3}#(?!#)[ \t]+.+$')
          H2_OR_LOWER = re.compile(r'^[ \t]{0,3}#{2,}[ \t]+.+$')
          changed = Path('/tmp/notes-validation.txt').read_text(encoding='utf-8').splitlines()
          failures = []

          def protected_lines(lines):
              protected = set()
              fenced = False
              html_comment = False
              frontmatter = bool(lines and lines[0].rstrip('\r\n') == '---')
              for index, line in enumerate(lines):
                  stripped = line.rstrip('\r\n')
                  if frontmatter:
                      protected.add(index)
                      if index > 0 and stripped == '---':
                          frontmatter = False
                      continue
                  if html_comment:
                      protected.add(index)
                      if '-->' in line:
                          html_comment = False
                      continue
                  if '<!--' in line:
                      protected.add(index)
                      if '-->' not in line[line.index('<!--') + 4:]:
                          html_comment = True
                      continue
                  if re.match(r'^[ \t]{0,3}```', line):
                      protected.add(index)
                      fenced = not fenced
                      continue
                  if fenced:
                      protected.add(index)
              return protected

          for path in sorted(ROOT.rglob('*.md')):
              lines = path.read_bytes().decode('utf-8').splitlines(keepends=True)
              protected = protected_lines(lines)
              remaining = [
                  (index + 1, line.rstrip('\r\n'))
                  for index, line in enumerate(lines)
                  if index not in protected and H1.match(line)
              ]
              if remaining:
                  failures.append(f'{path}: H1 real restante em {remaining}')

          for name in changed:
              path = Path(name)
              lines = path.read_bytes().decode('utf-8').splitlines(keepends=True)
              if lines and lines[0].rstrip('\r\n') == '---':
                  if not any(re.match(r'^title[ \t]*:', line) for line in lines[1:]):
                      failures.append(f'{path}: campo title ausente após alteração')

          diff = subprocess.run(
              ['git', 'diff', '--', '_notes'],
              capture_output=True,
              text=True,
              check=False,
          ).stdout
          for line in diff.splitlines():
              if line.startswith('-') and not line.startswith('---') and H2_OR_LOWER.match(line[1:]):
                  failures.append(f'H2/H3 removido indevidamente: {line}')

          if failures:
              print('\n'.join(failures))
              print('VALIDAÇÃO: FALHOU')
              sys.exit(1)

          print('VALIDAÇÃO: APROVADA — nenhum H1 real elegível permaneceu; H2/H3 e frontmatter preservados.')
          PY

      - name: Commit and push changes
        shell: bash
        run: |
          if git diff --quiet -- _notes; then
            echo 'Nenhuma alteração necessária; nenhum commit criado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _notes
          git commit -m 'fix: remove Markdown H1 headings from notes [skip ci]'
          git push origin HEAD:main
