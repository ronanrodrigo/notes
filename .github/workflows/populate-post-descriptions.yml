name: Populate post descriptions

on:
  push:
    branches:
      - feat/post-descriptions

permissions:
  contents: write

jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add descriptions
        run: python3 scripts/add-post-descriptions.py
      - name: Commit generated descriptions
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _posts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: add descriptions to post front matter"
          git push
