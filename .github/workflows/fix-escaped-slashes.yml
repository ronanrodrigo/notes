name: Normalize escaped slashes in notes

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace escaped slashes
        shell: python
        run: |
          from pathlib import Path

          changed = []
          for path in Path("_notes").rglob("*.md"):
              original = path.read_text(encoding="utf-8")
              corrected = original.replace("\\/", "/")
              if corrected != original:
                  path.write_text(corrected, encoding="utf-8")
                  changed.append(str(path))

          print(f"Arquivos corrigidos: {len(changed)}")
          for path in changed:
              print(path)

      - name: Commit and push corrections
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _notes
          if git diff --cached --quiet; then
            echo 'Nenhuma barra escapada encontrada.'
            exit 0
          fi
          git commit -m 'fix: replace escaped slashes in Markdown notes'
          git push origin main
