name: Normalize escaped slashes

on:
  push:
    branches:
      - fix/escaped-slashes-all-files

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace escaped slashes in Markdown files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for path in Path('.').rglob('*.md'):
              if '.git' in path.parts:
                  continue
              original = path.read_text(encoding='utf-8')
              normalized = re.sub(r'\\\\+/', '/', original)
              if normalized != original:
                  path.write_text(normalized, encoding='utf-8')
                  print(path)
          PY

      - name: Commit normalized files
        run: |
          if git diff --quiet; then
            echo "No escaped slashes found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.md'
          git commit -m "fix: remove escaped slashes from Markdown files"
          git push
