name: Update notes index

on:
  push:
    branches:
      - main
    paths:
      - "notes/*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild README index
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          readme = Path('README.md')
          start = '<!-- NOTES_INDEX_START -->'
          end = '<!-- NOTES_INDEX_END -->'
          pattern = re.compile(re.escape(start) + r'.*?' + re.escape(end), re.S)

          notes = []
          for path in sorted(Path('notes').glob('*.md'), reverse=True):
              lines = path.read_text(encoding='utf-8').splitlines()
              title = next((line[2:].strip() for line in lines if line.startswith('# ')), path.stem)
              date = path.name[:10]
              pretty_date = f'{date[8:10]}/{date[5:7]}/{date[0:4]}'
              notes.append(f'- [{pretty_date} - {title}](notes/{path.name})')

          index = '\n'.join(notes)
          replacement = f"{start}\n\n{index}\n\n{end}" if index else f"{start}\n\n{end}"
          text = readme.read_text(encoding='utf-8')
          updated = pattern.sub(replacement, text)
          if updated == text:
              print('README index already up to date.')
          else:
              readme.write_text(updated, encoding='utf-8')
              print('README index updated.')
          PY

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update notes index"
          git push origin HEAD:${GITHUB_REF_NAME}
