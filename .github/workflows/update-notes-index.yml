name: Update notes indexes

on:
  push:
    branches:
      - main
    paths:
      - "notes/*.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-indexes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild note indexes
        run: |
          python <<'PY'
          from pathlib import Path
          from collections import defaultdict
          import re

          def clean_title(title: str) -> str:
              return re.sub(r'^\d{1,2}\/\d{1,2}\/\d{4}\s*-\s*', '', title).strip()

          def parse_frontmatter(text: str):
              if not text.startswith('---\n'):
                  return {}, text
              match = re.match(r'^---\n(.*?)\n---\n?(.*)$', text, re.S)
              if not match:
                  return {}, text
              raw_fm, body = match.groups()
              data = {}
              tags = []
              lines = raw_fm.splitlines()
              i = 0
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('title:'):
                      data['title'] = line.split(':', 1)[1].strip().strip('"')
                  elif line.startswith('date:'):
                      data['date'] = line.split(':', 1)[1].strip().strip('"')
                  elif line.startswith('tags:'):
                      i += 1
                      while i < len(lines) and lines[i].startswith('  - '):
                          tags.append(lines[i][4:].strip())
                          i += 1
                      continue
                  i += 1
              data['tags'] = tags
              return data, body

          notes = []
          tags_map = defaultdict(list)

          for path in sorted(Path('notes').glob('*.md'), reverse=True):
              text = path.read_text(encoding='utf-8')
              fm, body = parse_frontmatter(text)

              h1 = next((line[2:].strip() for line in body.splitlines() if line.startswith('# ')), path.stem)
              title = fm.get('title') or clean_title(h1)
              date = fm.get('date') or path.name[:10]
              pretty_date = f'{date[8:10]}/{date[5:7]}/{date[0:4]}' if re.match(r'^\d{4}-\d{2}-\d{2}$', date) else date

              notes.append(f'- [{pretty_date} - {title}](notes/{path.name})')

              for tag in fm.get('tags', []):
                  tags_map[tag].append(f'- [{title}](notes/{path.name})')

          notes_index = '\n'.join(notes)
          readme = Path('README.md')
          start = '<!-- NOTES_INDEX_START -->'
          end = '<!-- NOTES_INDEX_END -->'
          pattern = re.compile(re.escape(start) + r'.*?' + re.escape(end), re.S)
          text = readme.read_text(encoding='utf-8')
          replacement = f'{start}\n\n{notes_index}\n\n{end}' if notes_index else f'{start}\n\n{end}'
          updated_readme = pattern.sub(replacement, text)
          readme.write_text(updated_readme, encoding='utf-8')

          index_file = Path('index.md')
          index_file.write_text(updated_readme, encoding='utf-8')

          tags_lines = ['# Índice por Tags', '', 'Índice gerado automaticamente a partir do frontmatter `tags` das notas.', '']
          for tag in sorted(tags_map.keys()):
              tags_lines.append(f'## {tag}')
              for item in sorted(tags_map[tag]):
                  tags_lines.append(item)
              tags_lines.append('')
          Path('tags.md').write_text('\n'.join(tags_lines).rstrip() + '\n', encoding='utf-8')

          print('Updated README.md, index.md and tags.md')
          PY

      - name: Commit & Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.md tags.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "docs: update indexes"
          git push origin HEAD:${GITHUB_REF_NAME}
