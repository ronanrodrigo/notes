name: Update notes index and site index

on:
  push:
    branches:
      - main
    paths:
      - "notes/*.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild README and index.md
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          # Build list of notes
          notes = []
          for path in sorted(Path('notes').glob('*.md'), reverse=True):
              lines = path.read_text(encoding='utf-8').splitlines()
              full_title = next((line[2:].strip() for line in lines if line.startswith('# ')), path.stem)
              title = re.sub(r'^\d{1,2}\/\d{1,2}\/\d{4}\s*-\s*', '', full_title)
              date = path.name[:10]
              pretty = f"{date[8:10]}/{date[5:7]}/{date[0:4]}"
              notes.append(f"- [{pretty} - {title}](notes/{path.name})")

          index_md = "\n".join(notes)

          # Update README.md
          readme = Path('README.md')
          start, end = '<!-- NOTES_INDEX_START -->', '<!-- NOTES_INDEX_END -->'
          pattern = re.compile(re.escape(start) + r'.*?' + re.escape(end), re.S)
          new_block = f"{start}\n\n{index_md}\n\n{end}"
          text = readme.read_text(encoding='utf-8')
          updated = pattern.sub(new_block, text)
          readme.write_text(updated, encoding='utf-8')

          # Also update index.md for site
          index_file = Path('index.md')
          index_file.write_text(updated, encoding='utf-8')
          print('Updated README.md and index.md')
          PY

      - name: Commit & Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.md
          git diff --quiet HEAD || (
            git commit -m "docs: update notes index and index.md"
            git push origin HEAD:${GITHUB_REF_NAME}
          )
