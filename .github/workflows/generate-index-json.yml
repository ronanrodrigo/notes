name: Generate JSON index

on:
  push:
    branches:
      - main
    paths:
      - '_posts/**'
      - 'scripts/generate-index.py'
      - 'index.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate index.json
        run: python3 scripts/generate-index.py

      - name: Commit index.json when it changes
        run: |
          if git diff --quiet -- index.json; then
            echo 'index.json is already up to date.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.json
          git commit -m 'chore: update generated index.json'
          git push
