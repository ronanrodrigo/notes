name: Generate JSON index

on:
  push:
    branches:
      - main
    paths:
      - '_posts/**'
      - 'scripts/generate-index.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ronanrodrigo/notes
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Run generate index script
        run: python3 scripts/generate-index.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- index.json; then
            echo 'index.json is already up to date.'
            exit 0
          fi
          
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.json
          git commit -m 'chore: update generated index.json'
          git pull --rebase
          git push
