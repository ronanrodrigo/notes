name: Publish raw Markdown files

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site-jekyll

      - name: Copy raw Markdown files
        run: |
          mkdir -p _site
          cp -a _site-jekyll/. _site/
          cp AGENTS.md _site/agents.md
          mkdir -p _site/skills
          cp skills/curadoria-de-conteudos.md _site/skills/curadoria-de-conteudos.md

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
