name: Normalize note links

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '_notes/**/*.md'
      - '.github/workflows/normalize-note-links.yml'

permissions:
  contents: write

jobs:
  normalize:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Normalize plain URLs
        id: normalize
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          URL = re.compile(r'https?://[^\s<>\[\]`]+')
          LINK = re.compile(r'!?\[[^\]]*\]\([^)]*\)')
          FENCE = re.compile(r'```.*?```', re.S)
          COMMENT = re.compile(r'<!--.*?-->', re.S)
          FRONTMATTER = re.compile(r'\A---\n.*?\n---\n', re.S)
          HEADING = re.compile(r'(?m)^\s{0,3}#{1,6}[^\n]*$')

          def protected_spans(text):
              spans = []
              for pattern in (FENCE, COMMENT, FRONTMATTER, LINK, HEADING):
                  spans.extend((m.start(), m.end()) for m in pattern.finditer(text))
              # Inline code: only backtick-delimited spans, including multi-backtick code.
              for m in re.finditer(r'(`+)(.*?)\1', text, re.S):
                  spans.append((m.start(), m.end()))
              spans.sort()
              merged = []
              for start, end in spans:
                  if merged and start <= merged[-1][1]:
                      merged[-1] = (merged[-1][0], max(merged[-1][1], end))
                  else:
                      merged.append((start, end))
              return merged

          def is_protected(pos, spans):
              # spans is sorted; the files are small, so a linear check is clear and safe.
              return any(start <= pos < end for start, end in spans)

          def normalize(text):
              spans = protected_spans(text)
              out, last, count = [], 0, 0
              for match in URL.finditer(text):
                  if is_protected(match.start(), spans):
                      continue
                  raw = match.group(0)
                  # Do not absorb sentence punctuation or Markdown closing punctuation.
                  trailing = ''
                  while raw and raw[-1] in '.,;:!?':
                      trailing = raw[-1] + trailing
                      raw = raw[:-1]
                  if not raw:
                      continue
                  url = raw.replace('\\/', '/')
                  out.append(text[last:match.start()])
                  out.append(f'[Acesse aqui]({url})')
                  out.append(trailing)
                  last = match.end()
                  count += 1
              out.append(text[last:])
              return ''.join(out), count

          changed = []
          converted = 0
          files = sorted(Path('_notes').rglob('*.md'))
          for path in files:
              original = path.read_text(encoding='utf-8')
              updated, count = normalize(original)
              converted += count
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f'Arquivos analisados: {len(files)}')
          print(f'Arquivos alterados: {len(changed)}')
          print(f'URLs convertidas: {converted}')
          print('Arquivos alterados:')
          for path in changed:
              print(f'- {path}')
          Path('/tmp/changed-files.txt').write_text('\n'.join(changed), encoding='utf-8')
          PY

      - name: Validate Markdown links
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, sys
          URL = re.compile(r'https?://[^\s<>\[\]`]+')
          LINK = re.compile(r'!?\[[^\]]*\]\([^)]*\)')
          FENCE = re.compile(r'```.*?```', re.S)
          COMMENT = re.compile(r'<!--.*?-->', re.S)
          FRONTMATTER = re.compile(r'\A---\n.*?\n---\n', re.S)
          HEADING = re.compile(r'(?m)^\s{0,3}#{1,6}[^\n]*$')
          def spans(t):
              s=[]
              for p in (FENCE, COMMENT, FRONTMATTER, LINK, HEADING): s += [(m.start(),m.end()) for m in p.finditer(t)]
              s += [(m.start(),m.end()) for m in re.finditer(r'(`+)(.*?)\1',t,re.S)]
              return s
          errors=[]
          for p in sorted(Path('_notes').rglob('*.md')):
              t=p.read_text(encoding='utf-8'); protected=spans(t)
              for m in URL.finditer(t):
                  if not any(a <= m.start() < b for a,b in protected):
                      errors.append(f'{p}: plain URL at offset {m.start()}: {m.group(0)}')
              for m in re.finditer(r'\[Acesse aqui\]\((.*?)\)', t):
                  if not re.fullmatch(r'https?://[^\s<>]+', m.group(1)):
                      errors.append(f'{p}: malformed Acesse aqui link: {m.group(0)}')
              if re.search(r'\[Acesse aqui\]\(\s*\[Acesse aqui\]', t):
                  errors.append(f'{p}: duplicated nested Acesse aqui link')
          if errors:
              print('\n'.join(errors)); sys.exit(1)
          print('Validação concluída: nenhuma URL pura, duplicação ou link malformado encontrado.')
          PY

      - name: Commit and push changes
        shell: bash
        run: |
          if git diff --quiet -- _notes; then
            echo 'Nenhuma alteração nos arquivos Markdown.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _notes
          git commit -m 'fix: convert plain URLs to clickable Markdown links [skip ci]'
          git push origin HEAD:main
