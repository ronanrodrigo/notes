name: Normalize shared post tags

on:
  push:
    branches:
      - refactor/common-tags-v2

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize tags
        run: python3 scripts/normalize-tags.py
      - name: Commit normalized posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts
          if git diff --cached --quiet; then
            echo "No tag changes"
          else
            git commit -m "refactor: apply shared post tags"
            git push
          fi
