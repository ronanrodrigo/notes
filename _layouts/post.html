---
layout: default
---

<article class="note" aria-labelledby="note-title">
  <header class="note-header">
    <h1 id="note-title">{{ page.title }}</h1>

    {% if page.date %}
    <p class="note-meta">
      <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%d/%m/%Y" }}</time>
    </p>
    {% endif %}

    {% if page.tags and page.tags.size > 0 %}
    <p class="note-tags" aria-label="Tags desta nota">
      {% for tag in page.tags %}
        <a href="{{ '/tag/' | relative_url }}?tag={{ tag | slugify }}">#{{ tag }}</a>{% unless forloop.last %} · {% endunless %}
      {% endfor %}
    </p>
    {% endif %}
  </header>

  <div class="note-content">
    {{ content }}
  </div>
</article>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "@id": {{ page.url | absolute_url | append: '#article' | jsonify }},
  "url": {{ page.url | absolute_url | jsonify }},
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | default: site.description | jsonify }},
  "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
  "dateModified": {{ page.date | date_to_xmlschema | jsonify }},
  "inLanguage": "pt-BR",
  "author": {
    "@type": "Person",
    "name": "Ronan Rodrigo Nunes",
    "url": "https://ronanrodrigo.dev/"
  },
  "isPartOf": {
    "@type": "Blog",
    "name": {{ site.title | jsonify }},
    "url": {{ '/' | absolute_url | jsonify }}
  },
  "keywords": {{ page.tags | jsonify }}
}
</script>
